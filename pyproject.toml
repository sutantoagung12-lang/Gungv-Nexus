[project]
name = "gungv-nexus"
version = "0.1.0"
description = "Gungv control plane for CMRA, repositories and worker federation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "httpx>=0.27",
  "pydantic>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.fastapi]
entrypoint = "nexus.api:app"

[tool.pytest.ini_options]
testpaths = ["tests"]