<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect Instagram — Gungv-Nexus</title><style>body{margin:0;background:#111;color:#fff;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.card{width:min(92vw,420px);padding:28px;border:1px solid #333;border-radius:22px;background:#191919;box-sizing:border-box}h1{font-size:24px;margin:0 0 10px}p{color:#bbb;line-height:1.5}button{width:100%;padding:15px;border:0;border-radius:14px;background:#fff;color:#111;font-weight:700;font-size:16px}.small{font-size:13px;color:#888;margin-top:18px}</style></head><body><main class="card"><h1>Connect Instagram</h1><p>Hubungkan akun Instagram Professional (Business/Creator) ke Gungv-Nexus melalui OAuth resmi Instagram.</p><button id="connect">Connect Instagram</button><p class="small">Password Instagram tidak dikirim ke Gungv-Nexus. Login dilakukan langsung di Instagram.</p></main><script>document.getElementById("connect").onclick=async()=>{const b=document.getElementById("connect");b.disabled=true;b.textContent="Membuka Instagram…";try{const r=await fetch("/instagram/connect",{headers:{"Accept":"application/json"}});const d=await r.json();if(!r.ok||!d.authorization_url)throw new Error(d.error||"Konfigurasi Instagram belum siap");location.href=d.authorization_url}catch(e){b.disabled=false;b.textContent="Connect Instagram";alert(e.message)}};</script></body></html>
