<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gungv AI Live Scene</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a10;color:#fff;font-family:system-ui,sans-serif}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:28px;box-sizing:border-box}
.avatar{width:220px;height:220px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#53657d,#18202c 55%,#0d1119);box-shadow:0 0 50px #000;font-size:90px;transition:transform .18s}
.avatar.speaking{animation:breathe .42s infinite alternate}
.face{font-size:84px}
.bubble{max-width:900px;width:min(92vw,900px);box-sizing:border-box;padding:22px 26px;border-radius:22px;background:#151a24;border:1px solid #2c3544;font-size:clamp(20px,3vw,34px);text-align:center;min-height:70px}
.meta{font-size:16px;opacity:.7}
@keyframes breathe{to{transform:scale(1.035)}}
</style>
</head>
<body>
<div class="wrap">
  <div id="avatar" class="avatar"><div class="face">🤖</div></div>
  <div id="bubble" class="bubble">AI Live Host siap.</div>
  <div id="meta" class="meta">Menunggu event…</div>
</div>
<script>
let last="";
const avatar=document.getElementById("avatar"), bubble=document.getElementById("bubble"), meta=document.getElementById("meta");
function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="id-ID"; u.rate=.96; u.pitch=1;
  u.onstart=()=>avatar.classList.add("speaking");
  u.onend=()=>avatar.classList.remove("speaking");
  speechSynthesis.speak(u);
}
async function poll(){
  try{
    const r=await fetch("/api/scene?since="+encodeURIComponent(last),{cache:"no-store"});
    const j=await r.json();
    if(j.event_id && j.event_id!==last){
      last=j.event_id;
      bubble.textContent=j.response;
      meta.textContent=j.kind==="support" ? "💰 Dukungan diterima" : "💬 Menjawab "+(j.user||"penonton");
      speak(j.response);
    }
  }catch(e){}
}
setInterval(poll,900);
poll();
</script>
</body>
</html>
