steps:
  - name: "python:3.12-slim"
    entrypoint: bash
    args:
      - -ceu
      - |
        python -m pip install --upgrade pip
        pip install "pytest>=8,<9"
        python scripts/validate_nexus.py
        python -m pytest -q

timeout: "600s"

options:
  logging: CLOUD_LOGGING_ONLY

tags:
  - gungv-nexus
  - validation
