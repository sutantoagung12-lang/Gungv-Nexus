name: validate-nexus
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: nexus-validate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install core test runtime
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8,<9"
      - name: Run Nexus tests
        run: python -m pytest -q
