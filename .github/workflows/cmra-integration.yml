name: CMRA Integration

on:
  push:
    paths:
      - 'cmra/**'
      - '.github/workflows/cmra-integration.yml'
  pull_request:
    paths:
      - 'cmra/**'
      - '.github/workflows/cmra-integration.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile cmra/integration/cmra_bridge.py
      - run: python -m pytest -q cmra/integration/test_cmra_bridge.py
