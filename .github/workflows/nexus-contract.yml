name: nexus-contract-validation

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: nexus-contract-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dependency-light Nexus validator
        env:
          PYTHONPATH: .
        run: python scripts/validate_nexus.py
      - name: Run autonomous skill control-plane tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_autonomous_skills.py tests/test_skill_builder.py tests/test_freedom_skill.py tests/test_domain_expansion.py tests/test_dictator_skill.py tests/test_ai_dominance.py tests/test_self_evolution.py tests/test_agent_controller.py tests/test_nexus_agent.py
