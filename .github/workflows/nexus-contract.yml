name: nexus-contract-validation

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: nexus-contract-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dependency-light Nexus validator
        run: python scripts/validate_nexus.py
