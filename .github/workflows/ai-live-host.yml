name: AI Live Host MVP

on:
  push:
    paths:
      - "ai-live-host/**"
      - ".github/workflows/ai-live-host.yml"
  pull_request:
    paths:
      - "ai-live-host/**"
      - ".github/workflows/ai-live-host.yml"

jobs:
  test-ai-live-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m pytest -q ai-live-host/test_core.py
