name: Nexus Repository Discovery

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover-and-integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover and integrate repository metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m integrations.repository_discovery

      - name: Commit discovery and capability-pool updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/discovery/latest.json integrations/github-capability-pool.json
          git diff --cached --quiet || git commit -m "chore: auto-integrate discovered repositories"
          git push
