name: Nexus Daily Frontier

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover public AI frontiers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import date
          from pathlib import Path

          queries = [
              "AI agent automation",
              "LLM agent tools",
              "AI browser automation",
              "AI memory knowledge graph",
              "local AI inference",
          ]
          nodes = []
          seen = set()
          headers = {"Accept": "application/vnd.github+json", "User-Agent": "Gungv-Nexus"}

          for query in queries:
              url = "https://api.github.com/search/repositories?q=" + urllib.parse.quote(query) + "&sort=updated&order=desc&per_page=5"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = json.load(response)
              for item in data.get("items", []):
                  full_name = item.get("full_name")
                  if not full_name or full_name in seen:
                      continue
                  seen.add(full_name)
                  nodes.append({
                      "id": full_name.lower().replace("/", "-"),
                      "title": full_name,
                      "type": "frontier-node",
                      "status": "discovered",
                      "source": item.get("html_url"),
                      "description": item.get("description") or "",
                      "stars": item.get("stargazers_count", 0),
                      "updated_at": item.get("updated_at"),
                  })

          today = date.today().isoformat()
          out = Path("runtime/frontier") / today
          out.mkdir(parents=True, exist_ok=True)
          (out / "discovered.json").write_text(json.dumps({
              "date": today,
              "policy": "daily-frontier",
              "nodes": nodes,
          }, indent=2), encoding="utf-8")

          skills = [{
              "id": "generated-" + n["id"],
              "name": "Explore " + n["title"],
              "source": n["source"],
              "problem": n["description"],
              "created_on": today,
              "policy": "review-before-activation",
          } for n in nodes]

          (out / "skill-proposals.json").write_text(json.dumps({
              "date": today,
              "status": "proposed",
              "skills": skills,
          }, indent=2), encoding="utf-8")

          lines = ["# Daily Frontier — " + today, "", f"Discovered nodes: {len(nodes)}", "", "## Nodes"]
          for n in nodes:
              lines.append(f"- [{n['title']}]({n['source']}) — {n['description']}")
          (out / "NODE.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Commit frontier pages
        run: |
          git config user.name "Gungv-Nexus Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/frontier
          git diff --cached --quiet || git commit -m "chore: daily frontier discovery"
          git push
